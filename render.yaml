# Render Blueprint — backend API (free tier). Secrets are set in the Render dashboard (sync: false).
services:
  - type: web
    name: sehat-saathi-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn --factory app.main:app_factory --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips="*"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ENV
        value: prod
      - key: MONGODB_DB
        value: sehat_saathi
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: PROVIDER
        value: gemini
      - key: VISION_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: VISION_API_KEY
        sync: false
      - key: VISION_MODEL
        sync: false
      - key: VISION_JSON_MODE
        value: json_schema
      - key: TEXT_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: TEXT_API_KEY
        sync: false
      - key: TEXT_MODEL
        sync: false
      - key: TEXT_JSON_MODE
        value: json_schema
