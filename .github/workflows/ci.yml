name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENV: test
      PROVIDER: fake
      # Dummy CI-only secret (not used anywhere real).
      JWT_SECRET: ci-only-dummy-secret-0123456789abcdefghijklmnopqrstuvwxyz0123456789
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: pip-audit -r requirements.txt --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - id: check
        run: |
          if [ -f frontend/package-lock.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.present == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.check.outputs.present == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
          npm test
          npm audit --audit-level=high --omit=dev

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --verbose --exit-code 1
